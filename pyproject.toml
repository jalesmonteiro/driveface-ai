[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "driveface-ai"
version = "0.1.0"
description = "DriveFace AI: Sistema de Agrupamento Facial para Google Drive com Deep Learning e pgvector"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "SDD Architect", email = "architect@driveface.ai" },
]
dependencies = [
    "Django>=5.0,<5.2",
    "djangorestframework>=3.15.0",
    "djangorestframework-simplejwt>=5.3.1",
    "django-cors-headers>=4.3.1",
    "django-environ>=0.11.2",
    "argon2-cffi>=23.1.0",
    "cryptography>=42.0.0",
    "celery>=5.3.6",
    "redis>=5.0.1",
    "psycopg[binary]>=3.1.18",
    "pgvector>=0.2.5",
    "google-api-python-client>=2.115.0",
    "google-auth-oauthlib>=1.2.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "pillow>=10.2.0",
]

[project.optional-dependencies]
ai = [
    "insightface>=0.7.3",
    "onnxruntime>=1.17.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
    "pytest-cov>=4.1.0",
    "flake8>=7.0.0",
    "black>=24.2.0",
    "isort>=5.13.0",
    "testcontainers[postgresql]>=3.7.1",
    "django-stubs>=5.1.0",
    "djangorestframework-stubs>=3.15.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
pythonpath = ["src/backend", "src/backend/apps"]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --strict-markers"

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src/backend", "src/backend/apps"]

[tool.pyrefly]
search_path = ["src/backend", "src/backend/apps"]
replace_untyped_imports_with_any = ["*"]

[tool.pyrefly.errors]
untyped-import = "ignore"
bad-override-mutable-attribute = "ignore"
bad-override = "ignore"
missing-attribute = "ignore"
