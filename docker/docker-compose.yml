services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: driveface_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-driveface_db}
      POSTGRES_USER: ${POSTGRES_USER:-driveface_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-driveface_secure_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-vector.sql:/docker-entrypoint-initdb.d/init-vector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-driveface_admin} -d ${POSTGRES_DB:-driveface_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: driveface_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: driveface_web
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - POSTGRES_HOST=postgres
      - DATABASE_URL=postgres://${POSTGRES_USER:-driveface_admin}:${POSTGRES_PASSWORD:-driveface_secure_pass}@postgres:5432/${POSTGRES_DB:-driveface_db}
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    ports:
      - "8000:8000"
    volumes:
      - ../src/backend:/app/src/backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: driveface_worker
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - POSTGRES_HOST=postgres
      - DATABASE_URL=postgres://${POSTGRES_USER:-driveface_admin}:${POSTGRES_PASSWORD:-driveface_secure_pass}@postgres:5432/${POSTGRES_DB:-driveface_db}
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ../src/backend:/app/src/backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
